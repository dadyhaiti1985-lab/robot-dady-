name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Extract application sources
        run: tar -xzf app.tar.gz

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build Web Application
        run: npm run build

      - name: Install lftp
        if: ${{ env.SFTP_SERVER != '' && env.SFTP_USERNAME != '' && env.SFTP_PASSWORD != '' }}
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via SFTP
        if: ${{ env.SFTP_SERVER != '' && env.SFTP_USERNAME != '' && env.SFTP_PASSWORD != '' }}
        run: |
          lftp <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=accept-new"
          open -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_SERVER"
          mkdir -p public_html
          mirror --reverse --delete --verbose ./dist/apps/web/ public_html/
          bye
          EOF
